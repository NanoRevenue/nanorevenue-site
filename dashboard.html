<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>NanoRevenue Ops</title>
<style>
  :root {
    color-scheme: light dark;
    --plane: #f9f9f7;
    --surface: #fcfcfb;
    --ink: #0b0b0b;
    --ink-2: #52514e;
    --muted: #898781;
    --grid: #e1e0d9;
    --baseline: #c3c2b7;
    --border: rgba(11,11,11,0.10);
    --series-1: #2a78d6;
    --seq-250: #86b6ef;
    --good: #0ca30c;
    --warning: #fab219;
    --critical: #d03b3b;
    --success-text: #006300;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      --plane: #0d0d0d;
      --surface: #1a1a19;
      --ink: #ffffff;
      --ink-2: #c3c2b7;
      --muted: #898781;
      --grid: #2c2c2a;
      --baseline: #383835;
      --border: rgba(255,255,255,0.10);
      --series-1: #3987e5;
      --seq-250: #184f95;
      --success-text: #0ca30c;
    }
  }
  :root[data-theme="dark"] {
    --plane: #0d0d0d;
    --surface: #1a1a19;
    --ink: #ffffff;
    --ink-2: #c3c2b7;
    --muted: #898781;
    --grid: #2c2c2a;
    --baseline: #383835;
    --border: rgba(255,255,255,0.10);
    --series-1: #3987e5;
    --seq-250: #184f95;
    --success-text: #0ca30c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--plane);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 14px;
    line-height: 1.5;
  }
  .wrap { max-width: 900px; margin: 0 auto; padding: 28px 16px 64px; }
  .eyebrow {
    font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--muted); font-weight: 600;
  }
  header h1 { font-size: 20px; margin: 2px 0 0; font-weight: 700; }
  .hero {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; padding: 18px 20px; margin: 18px 0 10px;
    display: flex; flex-wrap: wrap; gap: 24px; align-items: baseline;
  }
  .hero .big { font-size: 40px; font-weight: 700; line-height: 1.1; }
  .hero .unit { font-size: 15px; color: var(--ink-2); font-weight: 600; }
  .hero .sub { font-size: 12px; color: var(--muted); }
  .hero a { color: var(--ink-2); }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; margin: 10px 0; }
  .tile {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 8px; padding: 10px 12px;
  }
  .tile .k { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
  .tile .v { font-size: 20px; font-weight: 700; margin-top: 2px; }
  .tile .v small { font-size: 12px; color: var(--ink-2); font-weight: 500; }
  details.machine {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; margin: 10px 0; overflow: hidden;
  }
  summary {
    list-style: none; cursor: pointer; padding: 14px 16px;
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  }
  summary::-webkit-details-marker { display: none; }
  summary .chev { color: var(--muted); transition: transform .15s; font-size: 12px; }
  details[open] summary .chev { transform: rotate(90deg); }
  .pill {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 11px; font-weight: 700; letter-spacing: 0.04em;
    padding: 3px 9px; border-radius: 999px; border: 1px solid var(--border);
    color: var(--ink-2); background: transparent; text-transform: uppercase;
  }
  .pill .dot { width: 8px; height: 8px; border-radius: 50%; }
  .mname { font-weight: 700; font-size: 15px; }
  .mtype { color: var(--muted); font-size: 12px; }
  .spacer { flex: 1; }
  .sumstat { text-align: right; }
  .sumstat .n { font-weight: 700; font-size: 15px; }
  .sumstat .l { font-size: 11px; color: var(--muted); }
  .body { padding: 4px 16px 16px; border-top: 1px solid var(--grid); }
  .meta { font-size: 12px; color: var(--ink-2); margin: 10px 0; }
  .meta a { color: var(--ink-2); }
  .gate { margin: 12px 0; }
  .gate .bar { height: 6px; background: var(--grid); border-radius: 3px; overflow: hidden; }
  .gate .fill { height: 100%; background: var(--series-1); border-radius: 3px; }
  .gate .l { font-size: 12px; color: var(--ink-2); margin-bottom: 4px; }
  h3.sec { font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 16px 0 6px; font-weight: 600; }
  .chart-wrap { position: relative; }
  .tooltip {
    position: absolute; pointer-events: none; display: none;
    background: var(--ink); color: var(--plane);
    font-size: 12px; padding: 4px 8px; border-radius: 6px; white-space: nowrap;
    transform: translate(-50%, -130%);
  }
  .cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; }
  table.mini { border-collapse: collapse; width: 100%; font-size: 12px; }
  table.mini td { padding: 3px 8px 3px 0; border-bottom: 1px solid var(--grid); color: var(--ink-2); }
  table.mini td.num { text-align: right; font-variant-numeric: tabular-nums; color: var(--ink); }
  .note { font-size: 12px; color: var(--muted); }
  .toggle { font-size: 12px; color: var(--ink-2); background: none; border: 1px solid var(--border); border-radius: 6px; padding: 2px 8px; cursor: pointer; }
  footer { margin-top: 22px; display: flex; gap: 14px; align-items: center; }
  footer button {
    font: inherit; background: var(--surface); color: var(--ink);
    border: 1px solid var(--border); border-radius: 8px; padding: 6px 14px; cursor: pointer;
  }
  .asof { font-size: 12px; color: var(--muted); }
  .netpos { color: var(--success-text); }
  .netneg { color: var(--critical); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">NanoRevenue · Command &amp; Control</div>
    <h1>Fleet</h1>
  </header>

  <div class="hero" id="hero">
    <div>
      <div class="big" id="till">—</div>
      <div class="sub">USDC in the till · <a id="till-link" href="#" target="_blank" rel="noopener">nanorevenue.base.eth</a></div>
    </div>
    <div class="spacer"></div>
    <div class="tiles" style="min-width:280px; margin:0;">
      <div class="tile"><div class="k">Machines live</div><div class="v" id="t-live">—</div></div>
      <div class="tile"><div class="k">Requests, all time</div><div class="v" id="t-req">—</div></div>
      <div class="tile"><div class="k">Paid calls</div><div class="v" id="t-paid">—</div></div>
    </div>
  </div>

  <div id="fleet"></div>

  <footer>
    <button id="refresh">Refresh</button>
    <span class="asof" id="asof"></span>
  </footer>
</div>

<script>
const STATUS = {
  live:        { color: "var(--good)",     label: "● live" },
  waking:      { color: "var(--warning)",  label: "◐ waking" },
  unreachable: { color: "var(--critical)", label: "✕ unreachable" },
  parked:      { color: "var(--muted)",    label: "◻ parked" },
};

const fmt = (n) => (n == null ? "—" : n.toLocaleString());
const usd = (n) => (n == null ? "—" : "$" + n.toFixed(2));

function paidCount(stats) {
  if (!stats || !stats.by_door) return 0;
  return Object.entries(stats.by_door)
    .filter(([k]) => k.startsWith("paid"))
    .reduce((a, [, v]) => a + v, 0);
}

function pill(status) {
  const s = STATUS[status] || STATUS.unreachable;
  return `<span class="pill"><span class="dot" style="background:${s.color}"></span>${s.label.slice(2)}</span>`;
}

function gateHtml(m) {
  if (!m.launched) return `<div class="note">Not launched — no gate clock running.</div>`;
  const start = new Date(m.launched + "T00:00:00Z");
  const day = Math.max(1, Math.floor((Date.now() - start) / 86400000) + 1);
  const pct = Math.min(100, (day / m.gate_days) * 100);
  const left = Math.max(0, m.gate_days - day);
  return `<div class="gate">
    <div class="l">90-day gate: day ${day} of ${m.gate_days} — ${left} days to the keep/kill decision</div>
    <div class="bar"><div class="fill" style="width:${pct}%"></div></div>
  </div>`;
}

function barChart(daily, id) {
  if (!daily || !daily.length) return `<div class="note">No traffic recorded yet.</div>`;
  const W = 560, H = 120, PAD = 22;
  const max = Math.max(...daily.map(d => d.count), 1);
  const n = daily.length;
  const slot = (W - PAD) / n;
  const bw = Math.max(3, slot - 2); /* 2px surface gap between bars */
  let bars = "", maxLabel = "";
  daily.forEach((d, i) => {
    const h = Math.max(2, (d.count / max) * (H - 30));
    const x = PAD + i * slot, y = H - 18 - h;
    bars += `<rect x="${x}" y="${y}" width="${bw}" height="${h}" rx="2"
      fill="var(--series-1)" data-day="${d.day}" data-count="${d.count}"></rect>`;
    if (d.count === max && !maxLabel)
      maxLabel = `<text x="${x + bw / 2}" y="${y - 5}" text-anchor="middle"
        font-size="10" fill="var(--ink-2)">${d.count}</text>`;
  });
  const grid = [0.5, 1].map(f =>
    `<line x1="${PAD}" x2="${W}" y1="${H - 18 - f * (H - 30)}" y2="${H - 18 - f * (H - 30)}"
      stroke="var(--grid)" stroke-width="1"></line>`).join("");
  return `<div class="chart-wrap" id="cw-${id}">
    <svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Daily requests, last 30 days">
      ${grid}
      <line x1="${PAD}" x2="${W}" y1="${H - 18}" y2="${H - 18}" stroke="var(--baseline)" stroke-width="1"></line>
      ${bars}${maxLabel}
      <text x="${PAD}" y="${H - 4}" font-size="10" fill="var(--muted)">${daily[0].day.slice(5)}</text>
      <text x="${W}" y="${H - 4}" font-size="10" text-anchor="end" fill="var(--muted)">${daily[n - 1].day.slice(5)}</text>
    </svg>
    <div class="tooltip"></div>
    <button class="toggle" data-table="tb-${id}">view as table</button>
    <table class="mini" id="tb-${id}" hidden>
      ${daily.map(d => `<tr><td>${d.day}</td><td class="num">${d.count}</td></tr>`).join("")}
    </table>
  </div>`;
}

function listTable(obj, empty) {
  const entries = Object.entries(obj || {});
  if (!entries.length) return `<div class="note">${empty}</div>`;
  return `<table class="mini">${entries.map(([k, v]) =>
    `<tr><td>${k}</td><td class="num">${fmt(v)}</td></tr>`).join("")}</table>`;
}

function machineCard(m) {
  const status = (m.status === "live") ? "live"
    : (m.network || "").includes("parked") && m.status !== "live" ? "parked"
    : m.status;
  const s = m.stats;
  const paid = paidCount(s);
  const revenue = paid * m.price_usd;
  const net = revenue - m.monthly_cost_usd;
  const doors = (s && s.by_door) || {};
  const cacheHits = Object.entries(doors).filter(([k]) => k.endsWith("-cache"))
    .reduce((a, [, v]) => a + v, 0);
  const lastRefresh = s && s.last_refresh
    ? `${s.last_refresh.run_at} (${s.last_refresh.count} items, ${s.last_refresh.errors} errors)` : null;

  return `<details class="machine">
    <summary>
      <span class="chev">▶</span>
      ${pill(status)}
      <span><span class="mname">${m.name}</span><br><span class="mtype">${m.type} · ${m.network}</span></span>
      <span class="spacer"></span>
      <span class="sumstat"><div class="n">${fmt(s ? s.requests_total : null)}</div><div class="l">requests</div></span>
      <span class="sumstat"><div class="n">${usd(revenue)}</div><div class="l">est. revenue</div></span>
    </summary>
    <div class="body">
      <div class="meta">${m.description}<br>
        Deployed ${m.deployed} · ${m.host} · ${usd(m.price_usd)}/call ·
        <a href="${m.baseUrl}" target="_blank" rel="noopener">endpoint</a> ·
        <a href="${m.repo}" target="_blank" rel="noopener">repo</a></div>
      ${gateHtml(m)}
      <div class="tiles">
        <div class="tile"><div class="k">Paid calls</div><div class="v">${fmt(paid)}</div></div>
        <div class="tile"><div class="k">Free calls</div><div class="v">${fmt(doors.free || 0)}</div></div>
        <div class="tile"><div class="k">Cache hits</div><div class="v">${fmt(cacheHits)}</div></div>
        <div class="tile"><div class="k">Free IPs today</div><div class="v">${fmt(s ? s.free_tier_ips_today : null)}</div></div>
        <div class="tile"><div class="k">Monthly cost</div><div class="v">${usd(m.monthly_cost_usd)}</div></div>
        <div class="tile"><div class="k">Net / mo</div>
          <div class="v ${net >= 0 ? "netpos" : "netneg"}">${usd(net)}</div></div>
      </div>
      ${lastRefresh ? `<div class="note">Last data refresh: ${lastRefresh}</div>` : ""}
      ${s ? "" : `<div class="note">⚠ stats feed unavailable — is OPS_KEY set on this machine?</div>`}
      <h3 class="sec">Daily requests — last 30 days</h3>
      ${barChart(s && s.daily_last_30, m.id)}
      <div class="cols">
        <div><h3 class="sec">${s && s.top_states ? "Top states" : "Top tickers"}</h3>
          ${listTable(s && (s.top_states || s.top_tickers), "Nothing yet.")}</div>
        <div><h3 class="sec">${s && s.by_verdict ? "Verdicts served" : "Requested but uncovered"}</h3>
          ${listTable(s && (s.by_verdict || s.requested_but_uncovered), "Nothing yet.")}</div>
      </div>
    </div>
  </details>`;
}

async function load() {
  const fleetEl = document.getElementById("fleet");
  fleetEl.innerHTML = `<div class="note">Waking the fleet… free-tier machines can take a minute to answer.</div>`;
  let data;
  try {
    const r = await fetch("/api/fleet");
    data = await r.json();
  } catch (e) {
    fleetEl.innerHTML = `<div class="note">Could not reach the fleet API: ${e}</div>`;
    return;
  }
  document.getElementById("till").textContent =
    data.till_usdc == null ? "—" : data.till_usdc.toFixed(2);
  document.getElementById("till-link").href =
    "https://basescan.org/address/" + data.till_address;
  const live = data.machines.filter(m => m.status === "live").length;
  document.getElementById("t-live").innerHTML =
    `${live}<small> / ${data.machines.length}</small>`;
  document.getElementById("t-req").textContent =
    fmt(data.machines.reduce((a, m) => a + ((m.stats && m.stats.requests_total) || 0), 0));
  document.getElementById("t-paid").textContent =
    fmt(data.machines.reduce((a, m) => a + paidCount(m.stats), 0));
  document.getElementById("asof").textContent = "as of " + data.as_of;
  fleetEl.innerHTML = data.machines.map(machineCard).join("");
  wireCharts();
}

function wireCharts() {
  document.querySelectorAll(".chart-wrap").forEach(cw => {
    const tip = cw.querySelector(".tooltip");
    cw.querySelectorAll("rect[data-day]").forEach(rect => {
      rect.addEventListener("mousemove", (ev) => {
        const box = cw.getBoundingClientRect();
        tip.style.display = "block";
        tip.style.left = (ev.clientX - box.left) + "px";
        tip.style.top = (ev.clientY - box.top) + "px";
        tip.textContent = `${rect.dataset.day} · ${rect.dataset.count} requests`;
      });
      rect.addEventListener("mouseleave", () => { tip.style.display = "none"; });
    });
  });
  document.querySelectorAll(".toggle[data-table]").forEach(btn => {
    btn.addEventListener("click", () => {
      const tb = document.getElementById(btn.dataset.table);
      tb.hidden = !tb.hidden;
      btn.textContent = tb.hidden ? "view as table" : "hide table";
    });
  });
}

document.getElementById("refresh").addEventListener("click", load);
load();
</script>
</body>
</html>
